<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>财务记账 | 百万搞钱工作台</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#d4af37">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="百万工作台">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="stylesheet" href="assets/style.css">
  <style>
    .filter-bar {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .filter-bar .select, .filter-bar .input { width: auto; min-width: 140px; }
    .filter-bar .btn { margin-left: auto; }
    .summary-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
    .table-wrap { overflow-x: auto; }
    .data-table .col-income { color: var(--green); font-weight: 600; }
    .data-table .col-expense { color: var(--red); font-weight: 600; }
    .data-table .col-profit { color: var(--gold); font-weight: 700; }
    .data-table tfoot td { font-weight: 700; color: var(--gold); border-top: 2px solid var(--border-gold); border-bottom: none; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr 2fr auto; gap: 12px; align-items: end; margin-bottom: 24px; }
    .form-row label { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; display: block; }
  </style>
</head>
<body>
  <script src="assets/common.js"></script>
  <script>renderNav(2);</script>

  <div class="page-container">
    <div class="page-header">
      <div class="page-title">财务<span class="accent">记账</span></div>
      <div class="page-subtitle">收入 · 支出 · 利润 自动统计</div>
    </div>

    <!-- 汇总指标 -->
    <div class="summary-row">
      <div class="metric-card">
        <div class="metric-label">年度总收入</div>
        <div class="metric-value green">¥384,200</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">年度总支出</div>
        <div class="metric-value red">¥62,800</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">年度净利润</div>
        <div class="metric-value gold">¥321,400</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">利润率</div>
        <div class="metric-value">83.6%</div>
      </div>
    </div>

    <!-- 新增记录 -->
    <div class="card mb-24">
      <div class="card-title"><span class="icon">✍️</span>新增记账</div>
      <div class="form-row">
        <div>
          <label>日期</label>
          <input type="date" class="input" value="2026-07-27">
        </div>
        <div>
          <label>类型</label>
          <select class="select"><option>收入</option><option>支出</option></select>
        </div>
        <div>
          <label>赛道</label>
          <select class="select"><option>知识付费</option><option>电商带货</option><option>自媒体</option><option>通用支出</option></select>
        </div>
        <div>
          <label>金额（¥）</label>
          <input type="number" class="input" placeholder="0.00">
        </div>
        <div>
          <label>备注</label>
          <input type="text" class="input" placeholder="说明...">
        </div>
        <button class="btn btn-gold">+ 记一笔</button>
      </div>
    </div>

    <!-- 筛选栏 -->
    <div class="filter-bar">
      <select class="select">
        <option>全部赛道</option>
        <option>知识付费</option>
        <option>电商带货</option>
        <option>自媒体</option>
      </select>
      <select class="select">
        <option>全部类型</option>
        <option>收入</option>
        <option>支出</option>
      </select>
      <input type="month" class="input" value="2026-07">
      <button class="btn btn-outline">导出报表</button>
    </div>

    <!-- 记账表格 -->
    <div class="card">
      <div class="card-title"><span class="icon">📋</span>7月收支明细</div>
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>日期</th>
              <th>类型</th>
              <th>赛道</th>
              <th>项目说明</th>
              <th class="text-right">收入</th>
              <th class="text-right">支出</th>
              <th class="text-right">利润</th>
            </tr>
          </thead>
          <tbody id="finance-tbody">
            <!-- JS 渲染 -->
          </tbody>
          <tfoot>
            <tr>
              <td colspan="4">本月合计</td>
              <td class="text-right col-income" id="sum-income">¥0</td>
              <td class="text-right col-expense" id="sum-expense">¥0</td>
              <td class="text-right col-profit" id="sum-profit">¥0</td>
            </tr>
          </tfoot>
        </table>
      </div>
    </div>

    <!-- 月度对比 -->
    <div class="grid grid-2 mt-24">
      <div class="card">
        <div class="card-title"><span class="icon">📊</span>月度收支对比</div>
        <canvas id="month-compare" style="width:100%; height:260px;"></canvas>
      </div>
      <div class="card">
        <div class="card-title"><span class="icon">🥧</span>支出分类占比</div>
        <div id="expense-breakdown"></div>
      </div>
    </div>
  </div>

  <script>
    const records = [
      { date: "07-26", type: "收入", track: "知识付费", desc: "训练营第3期 · 5人", income: 4995, expense: 0 },
      { date: "07-25", type: "收入", track: "电商带货", desc: "家居百货分销佣金", income: 2380, expense: 0 },
      { date: "07-24", type: "支出", track: "通用支出", desc: "剪辑软件年费", income: 0, expense: 599 },
      { date: "07-23", type: "收入", track: "知识付费", desc: "1v1咨询 · 2人", income: 6000, expense: 0 },
      { date: "07-22", type: "收入", track: "自媒体", desc: "小红书软文广告", income: 3000, expense: 0 },
      { date: "07-21", type: "支出", track: "电商带货", desc: "样品采购", income: 0, expense: 850 },
      { date: "07-20", type: "收入", track: "电商带货", desc: "直播带货GMV佣金", income: 4200, expense: 0 },
      { date: "07-19", type: "收入", track: "知识付费", desc: "录播课销售 · 12单", income: 2388, expense: 0 },
      { date: "07-18", type: "支出", track: "通用支出", desc: "社群工具订阅", income: 0, expense: 199 },
      { date: "07-17", type: "收入", track: "自媒体", desc: "B站视频广告分成", income: 1200, expense: 0 },
      { date: "07-16", type: "收入", track: "电商带货", desc: "食品零食分销", income: 1560, expense: 0 },
      { date: "07-15", type: "支出", track: "通用支出", desc: "投放广告费", income: 0, expense: 2000 },
    ];

    const tbody = document.getElementById("finance-tbody");
    let totalIn = 0, totalOut = 0;
    records.forEach(r => {
      const profit = r.income - r.expense;
      totalIn += r.income;
      totalOut += r.expense;
      const typeTag = r.type === "收入"
        ? '<span class="tag tag-green">收入</span>'
        : '<span class="tag tag-red">支出</span>';
      const trackTag = {
        "知识付费": "tag-gold",
        "电商带货": "tag-blue",
        "自媒体": "tag-orange",
        "通用支出": "tag-gray"
      }[r.track] || "tag-gray";
      tbody.innerHTML += `
        <tr>
          <td>07月${r.date.split("-")[1]}日</td>
          <td>${typeTag}</td>
          <td><span class="tag ${trackTag}">${r.track}</span></td>
          <td>${r.desc}</td>
          <td class="text-right col-income">${r.income ? "¥" + r.income.toLocaleString() : "—"}</td>
          <td class="text-right col-expense">${r.expense ? "¥" + r.expense.toLocaleString() : "—"}</td>
          <td class="text-right col-profit">${profit ? "¥" + profit.toLocaleString() : "—"}</td>
        </tr>
      `;
    });
    document.getElementById("sum-income").textContent = "¥" + totalIn.toLocaleString();
    document.getElementById("sum-expense").textContent = "¥" + totalOut.toLocaleString();
    document.getElementById("sum-profit").textContent = "¥" + (totalIn - totalOut).toLocaleString();

    // 月度对比图
    drawBarChart("month-compare",
      ["1月","2月","3月","4月","5月","6月","7月"],
      [28000, 35000, 42000, 38000, 48000, 51000, 52300]
    );

    // 支出分类
    const breakdown = [
      { name: "投放广告", amount: 12000, pct: 38 },
      { name: "工具订阅", amount: 5600, pct: 18 },
      { name: "样品采购", amount: 4800, pct: 15 },
      { name: "内容制作", amount: 4200, pct: 13 },
      { name: "学习投资", amount: 3000, pct: 10 },
      { name: "其他", amount: 2000, pct: 6 },
    ];
    const bd = document.getElementById("expense-breakdown");
    breakdown.forEach(b => {
      bd.innerHTML += `
        <div style="margin-bottom:16px;">
          <div style="display:flex; justify-content:space-between; margin-bottom:6px; font-size:13px;">
            <span class="text-secondary">${b.name}</span>
            <span class="text-gold">¥${b.amount.toLocaleString()} · ${b.pct}%</span>
          </div>
          <div class="progress-bar"><div class="progress-fill" style="width:${b.pct}%;"></div></div>
        </div>
      `;
    });
  </script>
</body>
</html>
