<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>每日执行打卡 | 百万搞钱工作台</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#d4af37">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="百万工作台">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="stylesheet" href="assets/style.css">
  <style>
    .date-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 24px;
    }
    .date-bar .current-date { font-size: 20px; font-weight: 700; }
    .date-bar .current-date .weekday { color: var(--gold); margin-left: 12px; }
    .date-bar .streak-info { display: flex; gap: 32px; align-items: center; }
    .streak-item .label { font-size: 12px; color: var(--text-muted); }
    .streak-item .value { font-size: 24px; font-weight: 700; color: var(--gold); }
    .week-calendar { display: flex; gap: 8px; }
    .week-day {
      width: 48px; height: 56px;
      border-radius: 8px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: var(--text-muted);
    }
    .week-day .num { font-size: 16px; font-weight: 700; color: var(--text-primary); }
    .week-day.done { background: var(--gold-glow); border-color: var(--border-gold); }
    .week-day.done .num { color: var(--gold); }
    .week-day.today { border-color: var(--gold); border-width: 2px; }
    .task-section { margin-bottom: 24px; }
    .task-section-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .task-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 20px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 10px;
      transition: all 0.2s;
      cursor: pointer;
    }
    .task-item:hover { border-color: var(--border-gold); }
    .task-item.done { opacity: 0.5; }
    .task-item.done .task-text { text-decoration: line-through; }
    .checkbox {
      width: 22px; height: 22px;
      border-radius: 6px;
      border: 2px solid var(--border);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .task-item.done .checkbox {
      background: var(--gold);
      border-color: var(--gold);
    }
    .checkbox .check { display: none; font-size: 14px; color: #000; font-weight: 900; }
    .task-item.done .checkbox .check { display: block; }
    .task-text { flex: 1; font-size: 14px; color: var(--text-primary); }
    .task-meta { display: flex; gap: 8px; align-items: center; }
    .metric-input {
      width: 60px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 8px;
      color: var(--text-primary);
      font-size: 12px;
      text-align: center;
    }
    .daily-metrics {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }
    .metric-input-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
      text-align: center;
    }
    .metric-input-card .label { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; }
    .metric-input-card input {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
      color: var(--gold);
      font-size: 20px;
      font-weight: 700;
      text-align: center;
    }
    .metric-input-card .unit { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
  </style>
</head>
<body>
  <script src="assets/common.js"></script>
  <script>renderNav(4);</script>

  <div class="page-container">
    <div class="page-header">
      <div class="page-title">每日<span class="accent">执行打卡</span></div>
      <div class="page-subtitle">日清日结 · 行动创造结果</div>
    </div>

    <!-- 日期栏 -->
    <div class="date-bar">
      <div>
        <div class="current-date">2026年7月27日 <span class="weekday">周一</span></div>
        <div style="font-size:12px; color:var(--text-muted); margin-top:4px;">今日目标：¥2,740 · 已完成 ¥1,860</div>
      </div>
      <div class="streak-info">
        <div class="streak-item">
          <div class="label">连续打卡</div>
          <div class="value">23天</div>
        </div>
        <div class="streak-item">
          <div class="label">本周完成</div>
          <div class="value">5/7</div>
        </div>
        <div class="week-calendar">
          <div class="week-day done"><div>一</div><div class="num">21</div></div>
          <div class="week-day done"><div>二</div><div class="num">22</div></div>
          <div class="week-day done"><div>三</div><div class="num">23</div></div>
          <div class="week-day done"><div>四</div><div class="num">24</div></div>
          <div class="week-day done"><div>五</div><div class="num">25</div></div>
          <div class="week-day"><div>六</div><div class="num">26</div></div>
          <div class="week-day today"><div>日</div><div class="num">27</div></div>
        </div>
      </div>
    </div>

    <!-- 每日行动指标 -->
    <div class="daily-metrics">
      <div class="metric-input-card">
        <div class="label">内容产出</div>
        <input type="number" value="3" readonly>
        <div class="unit">条/天</div>
      </div>
      <div class="metric-input-card">
        <div class="label">新增线索</div>
        <input type="number" value="8" readonly>
        <div class="unit">个/天</div>
      </div>
      <div class="metric-input-card">
        <div class="label">客户跟进</div>
        <input type="number" value="12" readonly>
        <div class="unit">通/天</div>
      </div>
      <div class="metric-input-card">
        <div class="label">今日收入</div>
        <input type="number" value="1860" readonly>
        <div class="unit">元</div>
      </div>
    </div>

    <!-- 今日任务 -->
    <div class="task-section">
      <div class="task-section-title">
        <span>📋 今日任务清单</span>
        <span class="text-muted" style="font-size:12px;">5/8 已完成</span>
      </div>
      <div id="daily-tasks"></div>
    </div>

    <!-- 本周重点 -->
    <div class="task-section">
      <div class="task-section-title">
        <span>🎯 本周重点目标</span>
        <span class="text-muted" style="font-size:12px;">3/5 已完成</span>
      </div>
      <div id="weekly-tasks"></div>
    </div>

    <!-- 习惯打卡 -->
    <div class="card">
      <div class="card-title"><span class="icon">🔄</span>每日习惯打卡</div>
      <div class="grid grid-4">
        <div class="task-item done" onclick="toggleTask(this)">
          <div class="checkbox"><span class="check">✓</span></div>
          <div class="task-text">早起 (6:30前)</div>
        </div>
        <div class="task-item done" onclick="toggleTask(this)">
          <div class="checkbox"><span class="check">✓</span></div>
          <div class="task-text">运动30分钟</div>
        </div>
        <div class="task-item done" onclick="toggleTask(this)">
          <div class="checkbox"><span class="check">✓</span></div>
          <div class="task-text">学习1小时</div>
        </div>
        <div class="task-item" onclick="toggleTask(this)">
          <div class="checkbox"><span class="check">✓</span></div>
          <div class="task-text">复盘日记</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const dailyTasks = [
      { text: "发布小红书种草笔记 × 2", done: true, metric: "2/2" },
      { text: "录制抖音知识短视频 × 1", done: true, metric: "1/1" },
      { text: "跟进意向客户 (李婷、孙磊)", done: true, metric: "2/2" },
      { text: "训练营社群答疑互动", done: true, metric: "✓" },
      { text: "回复评论和私信 (>20条)", done: true, metric: "28/20" },
      { text: "选品调研：本周3款新品分析", done: false, metric: "1/3" },
      { text: "直播准备：脚本+选品排品", done: false, metric: "0%" },
      { text: "明日内容规划与素材准备", done: false, metric: "—" },
    ];

    const weeklyTasks = [
      { text: "训练营第3期招募满10人", done: true, metric: "12/10" },
      { text: "发布B站长视频 × 2", done: true, metric: "2/2" },
      { text: "完成1v1咨询交付 × 3", done: true, metric: "3/3" },
      { text: "直播带货1场（GMV目标¥8000）", done: false, metric: "筹备中" },
      { text: "月度复盘报告输出", done: false, metric: "待7/31" },
    ];

    function renderTasks(list, containerId) {
      const container = document.getElementById(containerId);
      list.forEach(t => {
        container.innerHTML += `
          <div class="task-item ${t.done ? 'done' : ''}" onclick="toggleTask(this)">
            <div class="checkbox"><span class="check">✓</span></div>
            <div class="task-text">${t.text}</div>
            <div class="task-meta">
              <span class="tag tag-gray">${t.metric}</span>
            </div>
          </div>
        `;
      });
    }

    function toggleTask(el) {
      el.classList.toggle("done");
    }

    renderTasks(dailyTasks, "daily-tasks");
    renderTasks(weeklyTasks, "weekly-tasks");
  </script>
</body>
</html>
