<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>作业拯救大作战 🧟</title>
  <style>
    :root {
      --green: #6fcf97;
      --green-deep: #27ae60;
      --green-light: #e6f9ee;
      --yellow: #ffd93d;
      --yellow-light: #fff8e1;
      --orange: #ff8a65;
      --pink: #ff8fab;
      --pink-light: #fce4ec;
      --blue: #74b9ff;
      --blue-light: #e3f2fd;
      --purple: #a29bfe;
      --purple-light: #eeeafe;
      --red: #ff6b6b;
      --bg: #f0faf3;
      --card: #ffffff;
      --text: #4a5568;
      --text-muted: #a0aec0;
      --border: #e8f0ea;
      --shadow: 0 4px 16px rgba(111,207,151,0.1);
      --shadow-card: 0 4px 20px rgba(0,0,0,0.05);
    }
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 15px;
      line-height: 1.6;
      min-height: 100vh;
    }
    ::-webkit-scrollbar { width:0; height:0; }

    /* ===== 标题区 ===== */
    .header {
      background: linear-gradient(135deg, #6fcf97, #a8e6cf);
      padding: 24px 20px;
      text-align: center;
      color: #fff;
      border-radius: 0 0 24px 24px;
      box-shadow: 0 4px 20px rgba(111,207,151,0.3);
    }
    .header h1 {
      font-size: 26px;
      font-weight: 800;
      text-shadow: 2px 2px 0 rgba(0,0,0,0.1);
      letter-spacing: 1px;
    }
    .header .subtitle {
      font-size: 13px;
      opacity: 0.9;
      margin-top: 4px;
    }
    .header .emojis { font-size: 32px; margin-top: 8px; }

    /* ===== 布局 ===== */
    .container { max-width: 900px; margin: 0 auto; padding: 16px; }
    
    @media (min-width: 768px) {
      .container { padding: 20px; }
      .main-grid { display: grid; grid-template-columns: 1fr 1.2fr 1fr; gap: 16px; }
    }

    .panel {
      background: var(--card);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-card);
    }

    .panel-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .panel-title .icon { font-size: 22px; }

    /* ===== 任务项 ===== */
    .task-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      background: var(--green-light);
      border-radius: 14px;
      margin-bottom: 10px;
      transition: all 0.2s;
    }
    .task-item.done {
      background: var(--green);
      opacity: 0.85;
    }
    .task-item.done .task-label { color: #fff; text-decoration: line-through; }

    .task-check {
      width: 26px; height: 26px;
      border-radius: 50%;
      border: 3px solid var(--green-deep);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      background: #fff;
    }
    .task-item.done .task-check {
      background: #fff;
      border-color: #fff;
    }
    .task-check .check { display:none; font-size:14px; color: var(--green-deep); font-weight:900; }
    .task-item.done .task-check .check { display:block; }

    .task-label {
      flex: 1; font-size: 15px; font-weight: 600; color: var(--text);
      cursor: pointer;
    }

    .task-btns { display:flex; gap:4px; flex-shrink:0; }
    .tbtn {
      width: 26px; height: 26px; border-radius: 50%;
      border: none; cursor: pointer; font-size: 13px;
      display:flex; align-items:center; justify-content:center;
      transition: all 0.2s;
    }
    .tbtn-edit { background: var(--blue-light); color: var(--blue); }
    .tbtn-edit:hover { background: var(--blue); color: #fff; }
    .tbtn-del { background: var(--pink-light); color: var(--pink); }
    .tbtn-del:hover { background: var(--red); color: #fff; }

    .add-row { display:flex; gap:8px; margin-top:12px; }
    .add-input {
      flex:1; padding:10px 14px; border:2px solid var(--border);
      border-radius:12px; font-size:14px; background:var(--bg); color:var(--text);
      font-family: inherit;
    }
    .add-input:focus { outline:none; border-color: var(--green); background:#fff; }
    .add-btn {
      width:42px; height:42px; border-radius:50%;
      background: var(--green); color:#fff; border:none; cursor:pointer;
      font-size:22px; font-weight:700; flex-shrink:0;
      box-shadow: 0 3px 10px rgba(111,207,151,0.3);
    }

    /* ===== 游戏区 ===== */
    .game-panel {
      text-align: center;
      background: linear-gradient(180deg, #e6f9ee 0%, #d4f1dd 100%);
      border: 2px solid var(--green-light);
      min-height: 320px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .game-status {
      font-size: 14px; font-weight: 600; color: var(--green-deep);
      margin-bottom: 12px;
    }

    .zombie-area {
      position: relative;
      width: 180px; height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .zombie {
      font-size: 80px;
      animation: bounce 1.5s ease-in-out infinite;
      transition: all 0.3s;
    }
    @keyframes bounce {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .zombie.eaten {
      animation: eaten 1s ease-in forwards;
    }
    @keyframes eaten {
      0% { transform: scale(1); opacity: 1; }
      30% { transform: scale(1.2) rotate(-10deg); }
      60% { transform: scale(0.8) rotate(20deg); opacity: 0.5; }
      100% { transform: scale(0); opacity: 0; }
    }

    .zombie.celebrate {
      animation: celebrate 0.6s ease-in-out 3;
    }
    @keyframes celebrate {
      0%,100% { transform: rotate(0) scale(1); }
      25% { transform: rotate(-10deg) scale(1.1); }
      75% { transform: rotate(10deg) scale(1.1); }
    }

    /* 爱心 */
    .hearts { display:flex; gap:4px; justify-content:center; margin-top:12px; min-height:28px; }
    .heart {
      font-size: 22px;
      animation: heartPop 0.4s ease-out;
    }
    @keyframes heartPop {
      0% { transform: scale(0); }
      60% { transform: scale(1.3); }
      100% { transform: scale(1); }
    }

    /* 草地 */
    .grass {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 40px;
      background: linear-gradient(180deg, transparent, var(--green) 50%);
      border-radius: 0 0 18px 18px;
    }

    /* 怪兽（没完成时出现） */
    .monster {
      position: absolute;
      font-size: 60px;
      right: -80px;
      bottom: 30px;
      transition: right 0.5s ease-in;
      display: none;
    }
    .monster.show {
      display: block;
      animation: monsterAttack 1.5s ease-in-out;
    }
    @keyframes monsterAttack {
      0% { right: -80px; }
      40% { right: 20px; }
      60% { right: 20px; transform: scale(1.2); }
      100% { right: -80px; transform: scale(1); }
    }

    /* 安全值条 */
    .safety-bar {
      width: 80%; max-width: 200px;
      height: 14px; background: rgba(255,255,255,0.6);
      border-radius: 7px; overflow: hidden; margin-top: 8px;
      border: 2px solid var(--green-deep);
    }
    .safety-fill {
      height: 100%; background: linear-gradient(90deg, var(--green), var(--green-deep));
      border-radius: 5px; transition: width 0.4s ease;
    }

    /* 奖励宝箱 */
    .treasure {
      font-size: 50px;
      margin-top: 10px;
      display: none;
    }
    .treasure.show {
      display: block;
      animation: treasurePop 0.6s ease-out;
    }
    @keyframes treasurePop {
      0% { transform: scale(0) rotate(0); }
      60% { transform: scale(1.3) rotate(10deg); }
      100% { transform: scale(1) rotate(0); }
    }

    /* ===== 奖励面板 ===== */
    .reward-item {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 14px;
      background: var(--yellow-light);
      border-radius: 14px;
      margin-bottom: 10px;
    }
    .reward-icon { font-size: 24px; flex-shrink:0; }
    .reward-label { flex:1; font-size:14px; font-weight:600; color:var(--text); cursor:pointer; }
    .reward-item.claimed { opacity: 0.5; background: var(--green-light); }
    .reward-item.claimed .reward-label { text-decoration: line-through; }

    /* ===== 统计区 ===== */
    .stats-grid { display:grid; grid-template-columns: repeat(3, 1fr); gap:12px; }
    .stat-box {
      background: var(--card);
      border-radius: 16px;
      padding: 16px;
      text-align: center;
      box-shadow: var(--shadow-card);
    }
    .stat-box .stat-value { font-size: 28px; font-weight: 800; }
    .stat-box .stat-label { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

    .reset-btn {
      width: 100%;
      padding: 14px;
      margin-top: 16px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--orange), var(--pink));
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 3px 12px rgba(255,138,101,0.3);
    }
    .reset-btn:active { transform: scale(0.98); }

    /* 消息提示 */
    .toast {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%,-50%) scale(0);
      background: #fff;
      padding: 20px 28px;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.15);
      text-align: center;
      z-index: 9999;
      transition: transform 0.3s;
      max-width: 300px;
    }
    .toast.show { transform: translate(-50%,-50%) scale(1); }
    .toast .toast-emoji { font-size: 40px; margin-bottom: 8px; }
    .toast .toast-text { font-size: 16px; font-weight: 700; color: var(--text); }

    /* 响应式 */
    @media (max-width: 767px) {
      .header h1 { font-size: 22px; }
      .zombie { font-size: 64px; }
      .zombie-area { width: 150px; height: 150px; }
    }
  </style>
</head>
<body>
  <!-- 标题区 -->
  <div class="header">
    <div class="emojis">🧟‍♂️ 👦 ⭐</div>
    <h1>作业拯救大作战</h1>
    <div class="subtitle">完成作业保护小僵尸，别让它被怪兽吃掉！</div>
  </div>

  <div class="container">
    <div class="main-grid">
      <!-- 左侧：任务面板 -->
      <div>
        <div class="panel">
          <div class="panel-title"><span class="icon">📝</span>今日作业任务</div>
          <div id="task-list"></div>
          <div class="add-row">
            <input type="text" class="add-input" id="task-input" placeholder="添加新任务...">
            <button class="add-btn" onclick="addTask()">+</button>
          </div>
        </div>
      </div>

      <!-- 中间：游戏区 -->
      <div>
        <div class="panel game-panel">
          <div class="grass"></div>
          <div class="game-status" id="game-status">完成作业来保护小僵尸吧！</div>
          <div class="zombie-area">
            <div class="zombie" id="zombie">🧟</div>
            <div class="monster" id="monster">👹</div>
            <div class="treasure" id="treasure">🎁</div>
          </div>
          <div class="hearts" id="hearts"></div>
          <div class="safety-bar">
            <div class="safety-fill" id="safety-fill" style="width:0%;"></div>
          </div>
          <div style="font-size:12px;color:var(--green-deep);margin-top:6px;font-weight:600;" id="safety-text">安全值 0 / 0</div>
        </div>
      </div>

      <!-- 右侧：奖励面板 -->
      <div>
        <div class="panel">
          <div class="panel-title"><span class="icon">🎁</span>奖励兑换</div>
          <div style="font-size:12px;color:var(--text-muted);margin-bottom:12px;">全部任务完成即可兑换奖励～</div>
          <div id="reward-list"></div>
          <div class="add-row">
            <input type="text" class="add-input" id="reward-input" placeholder="添加奖励...">
            <button class="add-btn" onclick="addReward()" style="background:var(--yellow);box-shadow:0 3px 10px rgba(255,217,61,0.3);">+</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 底部统计 -->
    <div class="panel">
      <div class="panel-title"><span class="icon">📊</span>今日战绩</div>
      <div class="stats-grid">
        <div class="stat-box">
          <div class="stat-value" style="color:var(--green-deep);" id="stat-done">0</div>
          <div class="stat-label">今日完成</div>
        </div>
        <div class="stat-box">
          <div class="stat-value" style="color:var(--orange);" id="stat-streak">5</div>
          <div class="stat-label">连续打卡天数</div>
        </div>
        <div class="stat-box">
          <div class="stat-value" style="color:var(--purple);" id="stat-saved">12</div>
          <div class="stat-label">拯救僵尸成功</div>
        </div>
      </div>
      <button class="reset-btn" onclick="resetDay()">🔄 开启新一天（重置任务）</button>
    </div>
  </div>

  <!-- 消息提示 -->
  <div class="toast" id="toast">
    <div class="toast-emoji" id="toast-emoji">🎉</div>
    <div class="toast-text" id="toast-text">太棒了！</div>
  </div>

  <script>
    // ===== 数据存储 =====
    const DB = {
      get(key, def) { try { const v = localStorage.getItem('zombie_'+key); return v ? JSON.parse(v) : def; } catch(e) { return def; } },
      set(key, val) { localStorage.setItem('zombie_'+key, JSON.stringify(val)); }
    };

    // ===== 初始数据 =====
    let tasks = DB.get('tasks', [
      { text: "语文作业", done: false },
      { text: "数学作业", done: false },
      { text: "英语背诵", done: false },
      { text: "课外阅读", done: false },
    ]);

    let rewards = DB.get('rewards', [
      { text: "看20分钟动画片", icon: "📺", claimed: false },
      { text: "吃一份小零食", icon: "🍪", claimed: false },
      { text: "周末去公园玩", icon: "公园", claimed: false },
      { text: "多玩半小时玩具", icon: "🧸", claimed: false },
    ]);

    let stats = DB.get('stats', { streak: 5, saved: 12 });
    let zombieAlive = true;

    // ===== 渲染任务 =====
    function renderTasks() {
      const c = document.getElementById('task-list');
      c.innerHTML = "";
      tasks.forEach((t,i) => {
        c.innerHTML += `
          <div class="task-item ${t.done?'done':''}">
            <div class="task-check" onclick="toggleTask(${i})"><span class="check">✓</span></div>
            <div class="task-label" onclick="toggleTask(${i})">${t.text}</div>
            <div class="task-btns">
              <button class="tbtn tbtn-edit" onclick="editTask(${i})" title="编辑">✎</button>
              <button class="tbtn tbtn-del" onclick="delTask(${i})" title="删除">×</button>
            </div>
          </div>`;
      });
      updateGame();
    }

    function toggleTask(i) {
      tasks[i].done = !tasks[i].done;
      DB.set('tasks', tasks);
      renderTasks();
      if (tasks[i].done) {
        showToast("💖", "小僵尸获得一颗爱心！");
      }
    }

    function editTask(i) {
      const v = prompt("修改任务：", tasks[i].text);
      if (v && v.trim()) {
        tasks[i].text = v.trim();
        DB.set('tasks', tasks);
        renderTasks();
      }
    }

    function delTask(i) {
      if (confirm("删除这个任务？")) {
        tasks.splice(i, 1);
        DB.set('tasks', tasks);
        renderTasks();
      }
    }

    function addTask() {
      const v = document.getElementById('task-input').value.trim();
      if (!v) return;
      tasks.push({ text: v, done: false });
      DB.set('tasks', tasks);
      document.getElementById('task-input').value = "";
      renderTasks();
    }

    document.getElementById('task-input').addEventListener('keypress', e => {
      if (e.key === 'Enter') addTask();
    });

    // ===== 渲染奖励 =====
    function renderRewards() {
      const c = document.getElementById('reward-list');
      c.innerHTML = "";
      rewards.forEach((r,i) => {
        c.innerHTML += `
          <div class="reward-item ${r.claimed?'claimed':''}">
            <span class="reward-icon">${r.icon || '🎁'}</span>
            <span class="reward-label" onclick="claimReward(${i})">${r.text}</span>
            <div class="task-btns">
              <button class="tbtn tbtn-edit" onclick="editReward(${i})" title="编辑">✎</button>
              <button class="tbtn tbtn-del" onclick="delReward(${i})" title="删除">×</button>
            </div>
          </div>`;
      });
    }

    function claimReward(i) {
      const done = tasks.filter(t => t.done).length;
      const total = tasks.length;
      if (done < total) {
        showToast("🔒", "还有任务没完成哦～加油！");
        return;
      }
      rewards[i].claimed = !rewards[i].claimed;
      DB.set('rewards', rewards);
      renderRewards();
      if (rewards[i].claimed) {
        showToast("🎉", `兑换成功：${rewards[i].text}！`);
      }
    }

    function editReward(i) {
      const v = prompt("修改奖励：", rewards[i].text);
      if (v && v.trim()) {
        rewards[i].text = v.trim();
        DB.set('rewards', rewards);
        renderRewards();
      }
    }

    function delReward(i) {
      if (confirm("删除这个奖励？")) {
        rewards.splice(i, 1);
        DB.set('rewards', rewards);
        renderRewards();
      }
    }

    function addReward() {
      const v = document.getElementById('reward-input').value.trim();
      if (!v) return;
      const icons = ["🎁","📺","🍪","🧸","🎮","🎈","🍦","🏊","🎨","⚽"];
      rewards.push({ text: v, icon: icons[Math.floor(Math.random()*icons.length)], claimed: false });
      DB.set('rewards', rewards);
      document.getElementById('reward-input').value = "";
      renderRewards();
    }

    document.getElementById('reward-input').addEventListener('keypress', e => {
      if (e.key === 'Enter') addReward();
    });

    // ===== 游戏更新 =====
    function updateGame() {
      const done = tasks.filter(t => t.done).length;
      const total = tasks.length;
      const zombie = document.getElementById('zombie');
      const hearts = document.getElementById('hearts');
      const safetyFill = document.getElementById('safety-fill');
      const safetyText = document.getElementById('safety-text');
      const status = document.getElementById('game-status');
      const monster = document.getElementById('monster');
      const treasure = document.getElementById('treasure');

      // 爱心
      hearts.innerHTML = "";
      for (let i = 0; i < done; i++) {
        const h = document.createElement("span");
        h.className = "heart";
        h.textContent = "💖";
        hearts.appendChild(h);
      }

      // 安全值
      const pct = total > 0 ? (done / total * 100) : 0;
      safetyFill.style.width = pct + "%";
      safetyText.textContent = `安全值 ${done} / ${total}`;

      // 统计
      document.getElementById('stat-done').textContent = done;

      if (total === 0) {
        status.textContent = "先添加作业任务吧～";
        return;
      }

      if (done === total) {
        // 全部完成！
        status.textContent = "🎉 全部完成！小僵尸安全啦！";
        zombie.className = "zombie celebrate";
        treasure.classList.add('show');
        monster.classList.remove('show');
        stats.saved++;
        DB.set('stats', stats);
        document.getElementById('stat-saved').textContent = stats.saved;
      } else if (done > 0) {
        status.textContent = "小僵尸正在被保护中，继续加油！";
        zombie.className = "zombie";
        treasure.classList.remove('show');
        monster.classList.remove('show');
      } else {
        status.textContent = "快去完成作业，保护小僵尸！";
        zombie.className = "zombie";
        treasure.classList.remove('show');
      }
    }

    // ===== 重置 =====
    function resetDay() {
      if (!confirm("确定开启新一天吗？任务将全部重置～")) return;
      tasks.forEach(t => t.done = false);
      rewards.forEach(r => r.claimed = false);
      stats.streak++;
      DB.set('tasks', tasks);
      DB.set('rewards', rewards);
      DB.set('stats', stats);
      document.getElementById('stat-streak').textContent = stats.streak;
      renderTasks();
      renderRewards();
      showToast("🌅", "新的一天开始啦！加油！");
    }

    // ===== 消息提示 =====
    let toastTimer;
    function showToast(emoji, text) {
      const t = document.getElementById('toast');
      document.getElementById('toast-emoji').textContent = emoji;
      document.getElementById('toast-text').textContent = text;
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
    }

    // ===== 初始化 =====
    document.getElementById('stat-streak').textContent = stats.streak;
    document.getElementById('stat-saved').textContent = stats.saved;
    renderTasks();
    renderRewards();
  </script>
</body>
</html>
