<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>减脂管理 | 成长工作台</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <script src="assets/common.js"></script>
  <script>renderSidebar("fitness");</script>

  <div class="main-content">
    <div class="page-header">
      <div class="page-title">🌸 减脂管理</div>
      <div class="page-subtitle">慢慢来，比较快</div>
    </div>

    <!-- 体重概览 -->
    <div class="card" style="background:var(--grad-pink);color:#fff;border:none;">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div>
          <div style="font-size:12px;opacity:0.85;">当前体重</div>
          <div style="font-size:36px;font-weight:700;" id="cur-weight">53.2kg</div>
          <div style="font-size:12px;opacity:0.8;margin-top:4px;">目标 50.0kg · 还差 3.2kg 💪</div>
        </div>
        <div style="font-size:48px;">🌷</div>
      </div>
    </div>

    <!-- 体重记录 -->
    <div class="card">
      <div class="card-title"><span class="title-icon">⚖️</span>记录今日体重</div>
      <div class="grid-2">
        <div class="input-row">
          <label>体重 (kg)</label>
          <input type="number" step="0.1" class="input" id="w-input" placeholder="如 53.0">
        </div>
        <div class="input-row" style="display:flex;align-items:flex-end;">
          <button class="btn btn-green btn-full" onclick="addWeight()">记录</button>
        </div>
      </div>
    </div>

    <!-- 体重趋势图 -->
    <div class="card">
      <div class="card-title"><span class="title-icon">📉</span>体重趋势</div>
      <canvas id="weight-chart" style="width:100%;height:200px;"></canvas>
    </div>

    <!-- 三餐打卡 -->
    <div class="card">
      <div class="card-title"><span class="title-icon">🍱</span>今日三餐打卡</div>
      <div id="meal-list"></div>
      <div class="add-item-row">
        <input type="text" class="input" id="meal-input" placeholder="加一餐，如：下午茶 水果">
        <button class="add-item-btn" onclick="addMeal()">+</button>
      </div>
      <div class="input-row mt-16">
        <label>加餐/零食记录 (选填)</label>
        <input type="text" class="input" id="snack-input" placeholder="如：一杯酸奶 100卡">
      </div>
    </div>

    <!-- 运动打卡 -->
    <div class="card">
      <div class="card-title"><span class="title-icon">🏃‍♀️</span>宿舍运动打卡</div>
      <div id="exercise-list"></div>
      <div class="add-item-row">
        <input type="text" class="input" id="exercise-input" placeholder="加一项运动，如：平板支撑 5min">
        <button class="add-item-btn" onclick="addExercise()">+</button>
      </div>
    </div>

    <!-- 热量记录 -->
    <div class="card">
      <div class="card-title"><span class="title-icon">🔥</span>今日热量</div>
      <div class="grid-3">
        <div style="text-align:center;padding:14px;background:var(--green-soft);border-radius:12px;">
          <div style="font-size:11px;color:var(--text-muted);">摄入</div>
          <div style="font-size:20px;font-weight:700;color:var(--green-deep);">1,280</div>
          <div style="font-size:10px;color:var(--text-muted);">kcal</div>
        </div>
        <div style="text-align:center;padding:14px;background:var(--pink-soft);border-radius:12px;">
          <div style="font-size:11px;color:var(--text-muted);">消耗</div>
          <div style="font-size:20px;font-weight:700;color:#d97a85;">320</div>
          <div style="font-size:10px;color:var(--text-muted);">kcal</div>
        </div>
        <div style="text-align:center;padding:14px;background:var(--yellow-soft);border-radius:12px;">
          <div style="font-size:11px;color:var(--text-muted);">净值</div>
          <div style="font-size:20px;font-weight:700;color:#c4a130;">960</div>
          <div style="font-size:10px;color:var(--text-muted);">kcal</div>
        </div>
      </div>
    </div>

    <!-- 欺骗餐记录 -->
    <div class="card">
      <div class="card-title"><span class="title-icon">🍰</span>欺骗餐记录</div>
      <div class="list-item">
        <div class="li-icon" style="background:var(--yellow-soft);">🧁</div>
        <div class="li-content"><div class="li-title">周日 Brunch</div><div class="li-sub">华夫饼+拿铁 · 约600卡</div></div>
        <div class="li-right text-muted">7/21</div>
      </div>
      <div class="input-row mt-16">
        <label>记录一次欺骗餐 (适度放松没关系～)</label>
        <input type="text" class="input" id="cheat-input" placeholder="吃了什么，开心就好">
      </div>
    </div>

    <!-- 每周体态复盘 -->
    <div class="card">
      <div class="card-title"><span class="title-icon">📝</span>每周体态复盘</div>
      <div class="input-row">
        <label>本周感受</label>
        <textarea class="textarea" placeholder="身体变化、心情、围度变化...">这周腰围好像细了一点点，坚持运动真的有用！</textarea>
      </div>
      <div class="input-row">
        <label>下周计划</label>
        <textarea class="textarea" placeholder="运动安排、饮食调整...">继续保持，加一组帕梅拉</textarea>
      </div>
    </div>
  </div>

  <script>
    // 体重数据
    let weights = DB.get("weights", [54.5, 54.2, 54.0, 53.8, 53.5, 53.3, 53.2]);
    const wLabels = ["7/15","7/16","7/17","7/18","7/19","7/20","7/21"];

    function addWeight() {
      const v = Number(document.getElementById("w-input").value);
      if (!v) { alert("输入体重哦～"); return; }
      weights.push(v);
      if (weights.length > 7) weights.shift();
      DB.set("weights", weights);
      DB.set("weightCurrent", v);
      document.getElementById("cur-weight").textContent = v + "kg";
      document.getElementById("w-input").value = "";
      drawLine("weight-chart", wLabels.slice(-weights.length), weights, "#ffb5ba", "#ffd6da");
    }

    setTimeout(() => {
      drawLine("weight-chart", wLabels, weights, "#ffb5ba", "#ffd6da");
    }, 100);

    // 三餐打卡
    const meals = DB.get("meals", [
      { name:"早餐 · 食堂", desc:"包子+豆浆", done:true },
      { name:"午餐 · 食堂", desc:"鸡胸肉+糙米饭", done:true },
      { name:"晚餐 · 宿舍", desc:"酸奶+燕麦", done:false },
    ]);

    function renderMeals() {
      const c = document.getElementById("meal-list");
      c.innerHTML = "";
      meals.forEach((m,i) => {
        c.innerHTML += `
          <div class="task-item ${m.done?'done':''}">
            <div class="task-check" onclick="toggleMeal(${i})"><span class="check">✓</span></div>
            <div class="task-text" onclick="editMeal(${i})">${m.name}<br><span style="font-size:12px;color:var(--text-muted);">${m.desc}</span></div>
            <div class="task-actions">
              <button class="task-edit-btn" onclick="editMeal(${i})" title="编辑">✎</button>
              <button class="task-del-btn" onclick="delMeal(${i})" title="删除">×</button>
            </div>
          </div>`;
      });
    }
    function toggleMeal(i) {
      meals[i].done = !meals[i].done;
      DB.set("meals", meals);
      renderMeals();
    }
    function editMeal(i) {
      const m = meals[i];
      const name = prompt("餐次名称：", m.name);
      if (name === null) return;
      const desc = prompt("吃的什么：", m.desc);
      if (desc === null) return;
      meals[i].name = name;
      meals[i].desc = desc;
      DB.set("meals", meals);
      renderMeals();
    }
    function addMeal() {
      const v = document.getElementById("meal-input").value.trim();
      if (!v) return;
      const parts = v.split(/\s+/);
      meals.unshift({ name: parts[0] || "加餐", desc: parts.slice(1).join(" ") || "—", done:false });
      DB.set("meals", meals);
      document.getElementById("meal-input").value = "";
      renderMeals();
    }
    function delMeal(i) {
      if (confirm("删除这餐？")) {
        meals.splice(i, 1);
        DB.set("meals", meals);
        renderMeals();
      }
    }
    renderMeals();

    // 运动打卡
    const exercises = DB.get("exercises", [
      { name:"帕梅拉腹部 15min", done:true },
      { name:"跳绳 1000个", done:false },
      { name:"瑜伽拉伸 20min", done:false },
      { name:"靠墙静蹲 3组", done:false },
    ]);

    function renderEx() {
      const c = document.getElementById("exercise-list");
      c.innerHTML = "";
      exercises.forEach((e,i) => {
        c.innerHTML += `
          <div class="task-item ${e.done?'done':''}">
            <div class="task-check" onclick="toggleEx(${i})"><span class="check">✓</span></div>
            <div class="task-text" onclick="editEx(${i})">${e.name}</div>
            <div class="task-actions">
              <button class="task-edit-btn" onclick="editEx(${i})" title="编辑">✎</button>
              <button class="task-del-btn" onclick="delEx(${i})" title="删除">×</button>
            </div>
          </div>`;
      });
    }
    function toggleEx(i) {
      exercises[i].done = !exercises[i].done;
      DB.set("exercises", exercises);
      renderEx();
    }
    function editEx(i) {
      const v = prompt("修改运动项：", exercises[i].name);
      if (v && v.trim()) {
        exercises[i].name = v.trim();
        DB.set("exercises", exercises);
        renderEx();
      }
    }
    function addExercise() {
      const v = document.getElementById("exercise-input").value.trim();
      if (!v) return;
      exercises.unshift({ name: v, done: false });
      DB.set("exercises", exercises);
      document.getElementById("exercise-input").value = "";
      renderEx();
    }
    function delEx(i) {
      if (confirm("删除这项运动？")) {
        exercises.splice(i, 1);
        DB.set("exercises", exercises);
        renderEx();
      }
    }
    renderEx();

    // 回车快捷新增
    document.getElementById("meal-input").addEventListener("keypress", e => {
      if (e.key === "Enter") addMeal();
    });
    document.getElementById("exercise-input").addEventListener("keypress", e => {
      if (e.key === "Enter") addExercise();
    });
  </script>
</body>
</html>
