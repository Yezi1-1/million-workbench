<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>成长工作台 | 首页</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#7dc892">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="成长工作台">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <script src="assets/common.js"></script>
  <script>renderSidebar("dashboard");</script>

  <div class="main-content">
    <!-- 问候卡 -->
    <div class="greeting-card">
      <div class="g-text">
        <div class="hello">早上好呀 ☀️</div>
        <div class="name">小叶子，今天也要闪闪发光</div>
        <div class="quote">"自律给我自由，温柔也有力量"</div>
      </div>
      <div class="g-emoji">🌷</div>
    </div>

    <!-- 四大核心指标 -->
    <div class="metric-grid">
      <div class="metric-card" onclick="editValue('saveGoal','年度攒钱目标',20000,'number')" style="cursor:pointer;">
        <div class="mc-icon" style="background:var(--green-light);">💰</div>
        <div class="mc-label">年度攒钱目标</div>
        <div class="mc-value" style="color:var(--green-deep)" id="save-goal-display">¥20,000</div>
        <div class="mc-sub">当前 <b style="color:var(--green-deep)" id="save-current-display">¥8,600</b> · 43%</div>
      </div>
      <div class="metric-card" onclick="editValue('weightGoal','目标体重',50,'number')" style="cursor:pointer;">
        <div class="mc-icon" style="background:var(--pink-soft);">🌸</div>
        <div class="mc-label">减肥目标</div>
        <div class="mc-value" style="color:#d97a85" id="weight-goal-display">50.0kg</div>
        <div class="mc-sub">当前 <b style="color:#d97a85" id="weight-current-display">53.2kg</b> · 打卡23天</div>
      </div>
      <div class="metric-card" onclick="editValue('englishGoal','四六级备考进度',75,'number')" style="cursor:pointer;">
        <div class="mc-icon" style="background:var(--blue-soft);">📖</div>
        <div class="mc-label">英语学习</div>
        <div class="mc-value" style="color:#5a9cc4" id="english-progress">75%</div>
        <div class="mc-sub">累计 <b style="color:#5a9cc4">186</b>小时 · 连续15天</div>
      </div>
      <div class="metric-card">
        <div class="mc-icon" style="background:var(--yellow-soft);">✨</div>
        <div class="mc-label">今日爆款采集</div>
        <div class="mc-value" style="color:#c4a130">8条</div>
        <div class="mc-sub">本周累计 <b style="color:#c4a130">42</b>条</div>
      </div>
    </div>

    <!-- 环形进度 -->
    <div class="card">
      <div class="card-title"><span class="title-icon">🎯</span>本月目标进度</div>
      <div style="display:flex;justify-content:space-around;flex-wrap:wrap;gap:16px;">
        <div>
          <canvas id="ring-save" class="ring-canvas"></canvas>
        </div>
        <div>
          <canvas id="ring-weight" class="ring-canvas"></canvas>
        </div>
        <div>
          <canvas id="ring-english" class="ring-canvas"></canvas>
        </div>
      </div>
    </div>

    <!-- 周打卡热力图 -->
    <div class="card">
      <div class="card-title"><span class="title-icon">🔥</span>本周打卡热力图</div>
      <div class="heatmap" id="week-heatmap"></div>
      <div style="display:flex;align-items:center;gap:8px;margin-top:14px;font-size:12px;color:var(--text-muted);">
        <span>未完成</span>
        <div class="heat-cell" style="width:14px;height:14px;"></div>
        <div class="heat-cell heat-done" style="width:14px;height:14px;"></div>
        <div class="heat-cell heat-done-2" style="width:14px;height:14px;"></div>
        <span>已完成</span>
        <span style="margin-left:auto;">连续打卡 <b style="color:var(--green-deep)">23</b> 天 🎉</span>
      </div>
    </div>

    <!-- 快捷入口 -->
    <div class="section-label">🚀 快捷入口</div>
    <div class="grid-2">
      <div class="list-item" onclick="go('money')" style="cursor:pointer;">
        <div class="li-icon" style="background:var(--green-light);">💰</div>
        <div class="li-content"><div class="li-title">记一笔</div><div class="li-sub">今天的收支</div></div>
        <div class="li-right">→</div>
      </div>
      <div class="list-item" onclick="go('fitness')" style="cursor:pointer;">
        <div class="li-icon" style="background:var(--pink-soft);">🌸</div>
        <div class="li-content"><div class="li-title">体重打卡</div><div class="li-sub">记录今日体重</div></div>
        <div class="li-right">→</div>
      </div>
      <div class="list-item" onclick="go('english')" style="cursor:pointer;">
        <div class="li-icon" style="background:var(--blue-soft);">📖</div>
        <div class="li-content"><div class="li-title">背单词</div><div class="li-sub">今日单词打卡</div></div>
        <div class="li-right">→</div>
      </div>
      <div class="list-item" onclick="go('trending')" style="cursor:pointer;">
        <div class="li-icon" style="background:var(--yellow-soft);">✨</div>
        <div class="li-content"><div class="li-title">采集爆款</div><div class="li-sub">刷到好内容</div></div>
        <div class="li-right">→</div>
      </div>
    </div>
  </div>

  <script>
    // 加载用户数据
    const saveGoal = DB.get("saveGoal", 20000);
    const saveCurrent = DB.get("saveCurrent", 8600);
    const weightGoal = DB.get("weightGoal", 50);
    const weightCurrent = DB.get("weightCurrent", 53.2);
    const englishProgress = DB.get("englishGoal", 75);

    document.getElementById("save-goal-display").textContent = fmtMoney(saveGoal);
    document.getElementById("save-current-display").textContent = fmtMoney(saveCurrent);
    document.getElementById("weight-goal-display").textContent = weightGoal + "kg";
    document.getElementById("weight-current-display").textContent = weightCurrent + "kg";
    document.getElementById("english-progress").textContent = englishProgress + "%";

    // 环形进度
    setTimeout(() => {
      drawRing("ring-save", (saveCurrent/saveGoal*100), "#7dc892", "#a8e6cf", "攒钱", fmtMoney(saveCurrent));
      drawRing("ring-weight", Math.min((58-weightCurrent)/(58-weightGoal)*100, 100), "#ffb5ba", "#ffd6da", "减脂", weightCurrent+"kg");
      drawRing("ring-english", englishProgress, "#a3d5f0", "#cce8f7", "英语", englishProgress+"%");
    }, 100);

    // 热力图
    renderHeatmap("week-heatmap", 7, [0,1,2,3,4,5,6]);
  </script>
</body>
</html>
